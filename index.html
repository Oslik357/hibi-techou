<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日々の手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日々の手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" href="icon-192.png?v=3">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: a single narrow column like a pocket planner — date masthead, today's page, bottom tab bar for thumbs */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#18202F; --muted:#5B677D; --line:#D9DFE9;
  --accent:#2C4E85; --accent-soft:#E2E9F5; --on-accent:#FFFFFF;
  --danger:#B23E2A; --danger-soft:#F8E6E2; --warn:#9A6414; --warn-soft:#F6EEDC; --ok:#2B7553; --ok-soft:#E0F1E8;
  --f-display:"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#19202B; --ink:#E5E9F1; --muted:#97A2B6; --line:#2B3443;
  --accent:#92B2E8; --accent-soft:#22314B; --on-accent:#0E1520;
  --danger:#EC8B76; --danger-soft:#3A2420; --warn:#E3B566; --warn-soft:#3A3020; --ok:#71C79E; --ok-soft:#1D3529;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#19202B; --ink:#E5E9F1; --muted:#97A2B6; --line:#2B3443;
  --accent:#92B2E8; --accent-soft:#22314B; --on-accent:#0E1520;
  --danger:#EC8B76; --danger-soft:#3A2420; --warn:#E3B566; --warn-soft:#3A3020; --ok:#71C79E; --ok-soft:#1D3529;
  color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{padding-block:20px 8px}
.era{margin:0;color:var(--muted);font-size:13px;letter-spacing:.08em}
.top h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.25;text-wrap:balance}
.status{margin:6px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.cloud::before{background:var(--ok)} .status.local::before{background:var(--warn)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
section{margin-top:22px}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}

.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.summary span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.summary b{color:var(--accent)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.item .body{flex:1;min-width:0}
.ttl{margin:0;font-weight:500;overflow-wrap:anywhere}
.meta{margin:2px 0 0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.check{flex-shrink:0;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"]::after{content:"";width:9px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:12px;padding:3px 8px;cursor:pointer;color:var(--muted);text-decoration:none;white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--muted)}
.mini.armed{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
.pri{border-radius:4px;padding:0 6px;font-weight:700;font-size:11px}
.p-high{background:var(--danger-soft);color:var(--danger)} .p-mid{background:var(--warn-soft);color:var(--warn)} .p-low{background:var(--accent-soft);color:var(--muted)}
.due{font-variant-numeric:tabular-nums}
.due.over{color:var(--danger);font-weight:700} .due.today{color:var(--accent);font-weight:700}
.cat{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.empty{color:var(--muted);font-size:13px;background:transparent;border:1px dashed var(--line);border-radius:var(--r);padding:12px;margin:0}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.form.editing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;flex-direction:column;gap:3px;min-width:0}
.row label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
input,select{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;font-size:16px}
.formacts{display:flex;justify-content:flex-end;gap:8px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.quick{display:flex;gap:8px;margin-top:14px}
.quick input{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.habit-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.habit-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stats{display:flex;gap:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{font-size:18px;color:var(--ink);font-family:var(--f-display)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:11px;color:var(--muted);line-height:1.3;font-variant-numeric:tabular-nums}
.day b{font-size:14px;color:var(--ink);font-weight:500}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on b{color:var(--on-accent)}
.day.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.on.is-today{box-shadow:none}
.streak{color:var(--ok);font-weight:700}

.evday{margin-top:16px}
.evday h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.evday h3.is-today{color:var(--accent);font-weight:700}
.time{flex-shrink:0;width:58px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent);font-weight:700;line-height:1.35;padding-top:1px}
.time small{display:block;color:var(--muted);font-weight:400}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px;margin-top:12px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{background:none;border:0;padding:8px 0 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--danger);color:var(--on-accent);border-radius:999px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:6;max-width:calc(100% - 32px)}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dnav h2{margin:0;flex:1;justify-content:center;text-align:center}
.mini:disabled{opacity:.4;cursor:default}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px 10px}
.paper:focus-within{border-color:var(--accent)}
#dText,#mBody,#qAns{display:block;width:100%;box-sizing:border-box;min-height:336px;border:0;border-radius:0;padding:0;resize:vertical;font-family:var(--f-body);font-size:16px;line-height:28px;color:var(--ink);background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px);background-attachment:local}
#dText:focus-visible,#mBody:focus-visible,#qAns:focus-visible,.paper input.mtitle:focus-visible{outline:none}
.paper input.mtitle{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;font-family:var(--f-display);font-size:20px;font-weight:700;padding:6px 0;margin-bottom:6px;min-height:44px}
.dprev .mt{font-size:15px;color:var(--ink)}
.dprev .mu{color:var(--muted);font-weight:400}
#dText::placeholder,#mBody::placeholder,#qAns::placeholder,.mtitle::placeholder{color:var(--muted)}
.dfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.dprev{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.dprev b{font-size:12px;color:var(--accent)}
.dprev span{overflow-wrap:anywhere}
.dprev small{color:var(--accent);font-size:12px;font-weight:700}
.dprev.empty-d{border-style:dashed}
.dprev.empty-d span{color:var(--muted);font-size:13px}
.dprev.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top>div:first-child{min-width:0}
.tools{display:flex;gap:6px;flex-shrink:0;padding-top:4px}
.tool{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:38px;min-width:38px;justify-content:center}
.tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tool:hover{border-color:var(--muted)}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
@media (max-width:480px){.tool span{display:none}.tool{padding:6px}}
mark{background:var(--warn-soft);color:var(--ink);border-radius:2px;padding:0 1px;box-shadow:inset 0 -2px 0 var(--warn)}
.found{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: no-preference){.item,.habit-card{transition:opacity .2s}}
/* ---- language study ---- */
.ai{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.aiacts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.lang{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.chk{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chk h4{margin:10px 0 0;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.ccom{margin:0;background:var(--ok-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.ctext{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.issues li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.issues p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ityp{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;color:var(--muted);vertical-align:1px}
.wr{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1px}
.rt{color:var(--ok);font-weight:700}
.vmean{color:var(--muted);font-weight:400;margin-left:6px}
.dots{letter-spacing:2px;color:var(--ok);font-size:11px}
.dots i{font-style:normal;color:var(--line)}
.card{background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 0 1px var(--accent);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.card .cinfo{margin:0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card .cword{margin:6px 0;font-size:30px;font-weight:700;text-align:center;overflow-wrap:anywhere;line-height:1.3}
.card .cmean{margin:0;font-size:18px;text-align:center}
.card .cex{margin:0;font-size:14px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.card .cbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.card .cbtns .btn{min-width:120px}
.vdef{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.selbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:7;max-width:620px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.selbar span{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar .btn{background:var(--ok);color:#fff;min-height:36px;padding:6px 14px}
.selbar .x{background:transparent;border:0;color:var(--bg);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.ctext,.issues li,.dprev span{-webkit-user-select:text;user-select:text}
#qAns{min-height:196px}
.qa{margin-top:6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.qmeta{margin:0;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lvl{border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 6px;font-size:11px;font-weight:700}
.qtext{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.5;font-weight:700;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.qprac{margin:0;font-size:13px;color:var(--muted)}
.qprac b{color:var(--ink);font-weight:500;background:var(--ok-soft);border-radius:4px;padding:0 5px;margin-right:4px;display:inline-block;margin-top:3px}
.qcard details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:700;padding:4px 0}
.qcard details .ctext{margin-top:6px}
.qgram{margin:0;font-size:13px;font-weight:700;color:var(--accent)}
details.drill{border-top:1px solid var(--line);padding-top:6px}
details.drill ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
details.drill li p{margin:0;overflow-wrap:anywhere}
.drow{display:flex;gap:6px;margin-top:4px}
.drow input{flex:1;min-width:0;min-height:36px;padding:6px 10px}
.dres{margin:3px 0 0;font-size:13px;color:var(--muted)}
.dres.ok{color:var(--ok);font-weight:700}
.dres.ng{color:var(--danger)}
.lvrow{display:flex;flex-direction:column;gap:3px}
.lvrow small{color:var(--muted);font-size:12px}
details.vadd{margin:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.vadd summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:700}
details.vadd .form{border:0;padding:10px 0 0;background:transparent}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="era" id="era"></p>
      <h1 id="dateHead"></h1>
      <p class="status" id="status">読み込み中…</p>
    </div>
    <div class="tools">
      <button class="tool" id="btnSearch" aria-pressed="false" aria-label="検索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>検索</span></button>
      <button class="tool" id="btnExport" aria-label="Excelに書き出す"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg><span>Excelに書き出す</span></button>
      <button class="tool" id="btnImport" aria-label="Excelから読み込む"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 19h14"/></svg><span>読み込む</span></button>
      <input type="file" id="fileIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>
  </header>
  <main id="view"></main>
  <p class="found" style="text-align:center;margin:-60px 0 90px;font-size:11px">日々の手帳 オフライン版 v9（11/3 18:50）</p>
</div>
<datalist id="cats"></datalist>
<div class="toast" id="toast" hidden></div>
<div class="selbar" id="selBar" hidden><span id="selTxt"></span><button class="btn" id="selAdd">単語帳へ</button><button class="x" id="selClose" aria-label="閉じる">×</button></div>

<nav class="tabs" aria-label="画面の切り替え"><div class="in">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
  <button class="tab" data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>タスク<span class="badge" id="badge" hidden></span></button>
  <button class="tab" data-tab="habits"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v4h-4"/><path d="M9 12l2 2 4-4"/></svg>習慣</button>
  <button class="tab" data-tab="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>予定</button>
  <button class="tab" data-tab="diary"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>日記</button>
  <button class="tab" data-tab="memo"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/></svg>メモ</button>

<script src="xlsx.full.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const view=$('#view');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD='日月火水木金土';
const fmtLong=s=>{const d=parse(s);return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`};
const fmtShort=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRI={high:'高',mid:'中',low:'低'}, PRANK={high:0,mid:1,low:2};
const DEFAULT_CATS=['IPPジャパン','トーション','MITIA','個人'];
const LANG={ru:'ロシア語',es:'スペイン語',en:'英語'}, LANGS=['ru','es','en'];
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LK='hibi-techou-v1';
const COLS=['tasks','habits','events','diary','memos','checks','vocab','prompts','profile'];
const VIEWS=['today','tasks','habits','schedule','diary','memo','learn','search'];
const S={tab:'today',editTask:null,editEvent:null,filter:'open',cat:'',showPast:false,day:today(),dDate:today(),q:'',sKind:'all',memoId:null,
  lang:null,ai:null,lLang:'all',card:null,qLang:null,qGen:false,qErr:false};

function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2600)}
const use=name=>{try{return (window.claude&&window.claude.use)?window.claude.use(name).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};

/* ---------- device storage (IndexedDB, falls back to localStorage) ---------- */
let _idb=null;
function idb(){ if(_idb) return Promise.resolve(_idb);
  return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no idb')); const r=indexedDB.open('hibi-techou',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{_idb=r.result;res(_idb)}; r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* ---------- store: Claude cloud (synced) or this device only ---------- */
const emptyData=()=>({tasks:[],habits:[],events:[],diary:[],memos:[],checks:[],vocab:[],prompts:[],profile:[],deleted:{}});
const okId=id=>typeof id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)&&id!=='.'&&id!=='..';
const Store={mode:'loading',data:emptyData(),meta:{lastExport:0},base:null,delRef:null,
  async init(){
    try{const m=await idbGet('meta'); if(m) this.meta=Object.assign(this.meta,m)}catch(e){ try{const m=JSON.parse(localStorage.getItem(LK+'-meta')||'null'); if(m)Object.assign(this.meta,m)}catch(_){} }
    const [db,user]=await Promise.all([use('db'),use('user')]);
    let uid=null; try{ if(user) uid=await user.id() }catch(e){}
    if(db&&uid){
      this.mode='cloud';
      this.base=db.doc(`data/users/${uid}/app`);
      this.delRef=this.base.collection('meta').doc('deleted');
      COLS.forEach(c=>{
        this.base.collection(c).onSnapshot(s=>{this.data[c]=s.docs.map(d=>Object.assign({id:d.id},d.data()));refresh()},
          ()=>toast('同期が止まりました。ページを開き直してください'));
      });
      this.delRef.onSnapshot(s=>{this.data.deleted=s.exists?(s.data()||{}):{}},()=>{});
    }else{
      this.mode='local';
      let v=null; try{ v=await idbGet('data') }catch(e){}
      if(!v){ try{ v=JSON.parse(localStorage.getItem(LK)||'null') }catch(e){} }
      if(v) this.data=Object.assign(emptyData(),v);
      try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
    }
    status(); refresh();
  },
  ready(){ if(this.mode==='loading'){toast('読み込み中です。少し待ってからもう一度どうぞ');return false} return true },
  saveLocal(){ idbSet('data',this.data).catch(()=>{ try{localStorage.setItem(LK,JSON.stringify(this.data))}catch(e){toast('この端末に保存できませんでした')} }) },
  saveMeta(){ idbSet('meta',this.meta).catch(()=>{ try{localStorage.setItem(LK+'-meta',JSON.stringify(this.meta))}catch(e){} }) },
  async add(c,obj){ if(!this.ready())return null;
    const id=genId(), o=Object.assign({},obj,{updated:Date.now()});
    if(this.mode==='cloud'){ try{await this.base.collection(c).doc(id).set(o)}catch(e){fail(e);return null} }
    else { this.data[c].push(Object.assign({id},o)); this.saveLocal(); refresh() }
    return id },
  async update(c,id,patch){ if(!this.ready())return;
    const p=Object.assign({},patch,{updated:Date.now()});
    if(this.mode==='cloud'){ try{await this.base.collection(c).doc(id).update(p)}catch(e){fail(e)} return }
    const it=this.data[c].find(x=>x.id===id); if(!it)return;
    for(const k in p){ if(p[k]&&typeof p[k]==='object'&&!Array.isArray(p[k])) it[k]=Object.assign({},it[k]||{},p[k]); else it[k]=p[k]; }
    this.saveLocal(); refresh() },
  async put(c,id,obj){ if(!this.ready())return;
    const o=Object.assign({},obj); delete o.id; if(!o.updated) o.updated=Date.now();
    if(this.mode==='cloud'){ try{await this.base.collection(c).doc(id).set(o)}catch(e){fail(e)} return }
    const i=this.data[c].findIndex(x=>x.id===id), n=Object.assign({id},o); if(i>=0) this.data[c][i]=n; else this.data[c].push(n); this.saveLocal(); refresh() },
  async remove(c,id){ if(!this.ready())return;
    const had=this.data[c].some(x=>x.id===id);
    const del=JSON.parse(JSON.stringify(this.data.deleted||{})); if(had)(del[c]=del[c]||{})[id]=Date.now();
    if(this.mode==='cloud'){ try{ await this.base.collection(c).doc(id).delete(); if(had){ this.data.deleted=del; await this.delRef.set(del) } }catch(e){fail(e)} return }
    this.data[c]=this.data[c].filter(x=>x.id!==id); this.data.deleted=del; this.saveLocal(); refresh() },
  /* apply the result of mergeData() */
  async apply(m){
    if(this.mode==='cloud'){
      let n=0; const total=m.changes.length;
      for(const ch of m.changes){
        const ref=this.base.collection(ch.c).doc(ch.id);
        try{ if(ch.item){const o=Object.assign({},ch.item); delete o.id; await ref.set(o)} else await ref.delete() }
        catch(e){ if(e&&e.code==='quota_exceeded'){fail(e);return false} }
        n++; if(total>20&&n%10===0) toast(`読み込み中… ${n}/${total}`,60000);
      }
      try{ await this.delRef.set(m.deleted) }catch(e){}
      this.data.deleted=m.deleted; return true;
    }
    for(const ch of m.changes){
      const arr=this.data[ch.c], i=arr.findIndex(x=>x.id===ch.id);
      if(ch.item){ if(i>=0) arr[i]=ch.item; else arr.push(ch.item) } else if(i>=0) arr.splice(i,1);
    }
    this.data.deleted=m.deleted; this.saveLocal(); return true;
  }
};
function fail(e){ toast(e&&e.code==='quota_exceeded'?'保存容量がいっぱいです。不要な項目を削除してください':'保存できませんでした。もう一度お試しください') }
function fmtAgo(n){ if(!n) return ''; const d=new Date(n); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` }
function status(){const el=$('#status'), le=Store.meta.lastExport;
  if(Store.mode==='loading'){el.className='status';el.textContent='読み込み中…';return}
  const days=le?Math.floor((Date.now()-le)/864e5):null, late=days===null||days>=7;
  el.className='status '+(Store.mode==='cloud'?'ok':late?'due':'ok');
  el.textContent=(Store.mode==='cloud'?'PC・iPhone で同期中':'この端末に保存')+' ・ '+(le?`最後の書き出し ${fmtAgo(le)}`:'まだ書き出していません')+(days!==null&&days>=7?`（${days}日前）`:'');}

/* ---------- derived data ---------- */
function streak(log){let d=today(); if(!log||!log[d]) d=addDays(d,-1); let n=0; while(log&&log[d]){n++; d=addDays(d,-1)} return n}
function rate(h){const td=today();let span=30; if(h.created){const days=Math.round((parse(td)-parse(h.created))/864e5)+1; span=Math.max(1,Math.min(30,days))}
  let c=0; for(let i=0;i<span;i++) if(h.log&&h.log[addDays(td,-i)]) c++; return {pct:Math.round(c/span*100),span}}
function sortTasks(a,b){ if(!!a.done!==!!b.done) return a.done?1:-1;
  const da=a.due||'9999', dbb=b.due||'9999'; if(da!==dbb) return da<dbb?-1:1;
  return (PRANK[a.priority]??1)-(PRANK[b.priority]??1) }
const sortEv=(a,b)=>(a.date+(a.start||'00:00')).localeCompare(b.date+(b.start||'00:00'));
function gcal(e){
  const p=new URLSearchParams({action:'TEMPLATE',text:e.title||'予定',ctz:'Asia/Tokyo'});
  const d=e.date.replace(/-/g,'');
  if(e.start){
    const st=d+'T'+e.start.replace(':','')+'00'; let en;
    if(e.end&&e.end>e.start) en=d+'T'+e.end.replace(':','')+'00';
    else{const [h,m]=e.start.split(':').map(Number); en=d+'T'+(h>=23?'2359':pad(h+1)+pad(m))+'00'}
    p.set('dates',st+'/'+en);
  }else p.set('dates',d+'/'+addDays(e.date,1).replace(/-/g,''));
  if(e.place)p.set('location',e.place); if(e.memo)p.set('details',e.memo);
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/́/g,'').replace(/ё/g,'е');
const vKey=(lang,w)=>lang+'|'+norm(w).trim();
const BOX_DAYS=[0,0,1,3,7,14,30];
const isDue=v=>!v.due||v.due<=today();
function detectLang(t){ t=String(t||'');
  const cyr=(t.match(/[Ѐ-ӿ]/g)||[]).length, lat=(t.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
  if(cyr>=lat&&cyr>0) return 'ru';
  if(!lat) return null;
  if(/[ñ¿¡]|[áéíóú]/i.test(t)||/\b(el|los|las|que|de|y|en|una?|muy|pero|porque|hoy|estoy|fue|está)\b/i.test(t)&&!/\b(the|and|is|was|i'm|it's|of)\b/i.test(t)) return 'es';
  return 'en';
}

/* ---------- item templates ---------- */
const empty=t=>`<p class="empty">${t}</p>`;
function taskItem(t){const td=today();let due='';
  if(t.due){const over=!t.done&&t.due<td;due=`<span class="due ${over?'over':t.due===td?'today':''}">${over?'期限切れ ':''}${t.due===td?'今日まで':fmtShort(t.due)}</span>`}
  const pr=t.priority||'mid';
  return `<li class="item ${t.done?'done':''}"><button class="check" data-act="toggleTask" data-id="${esc(t.id)}" aria-pressed="${!!t.done}" aria-label="${t.done?'未完了に戻す':'完了にする'}"></button>
  <div class="body"><p class="ttl">${esc(t.title)}</p><p class="meta"><span class="pri p-${pr}">優先度 ${PRI[pr]}</span>${due}${t.category?`<span class="cat">${esc(t.category)}</span>`:''}</p></div>
  <div class="acts"><button class="mini" data-act="editTask" data-id="${esc(t.id)}">編集</button><button class="mini" data-act="del" data-col="tasks" data-id="${esc(t.id)}">削除</button></div></li>`}
function habitToday(h){const d=today(),on=!!(h.log&&h.log[d]),s=streak(h.log);
  return `<li class="item"><button class="check" data-act="toggleHab" data-id="${esc(h.id)}" data-d="${d}" aria-pressed="${on}" aria-label="今日の記録"></button>
  <div class="body"><p class="ttl">${esc(h.name)}</p><p class="meta">${s?`<span class="streak">${s}日連続</span>`:'今日から始めましょう'}</p></div></li>`}
function evItem(e,withActs){
  const tm=e.start?`${e.start}${e.end?`<small>〜${e.end}</small>`:''}`:'終日';
  return `<li class="item"><div class="time">${tm}</div><div class="body"><p class="ttl">${esc(e.title)}</p>${(e.place||e.memo)?`<p class="meta">${e.place?esc(e.place):''}${e.place&&e.memo?' ・ ':''}${e.memo?esc(e.memo):''}</p>`:''}</div>
  ${withActs?`<div class="acts"><a class="mini" href="${esc(gcal(e))}" target="_blank" rel="noopener">カレンダーに追加</a><button class="mini" data-act="editEvent" data-id="${esc(e.id)}">編集</button><button class="mini" data-act="del" data-col="events" data-id="${esc(e.id)}">削除</button></div>`:''}</li>`}
const dots=b=>{b=Math.max(1,Math.min(6,b||1));return `<span class="dots" title="習熟度 ${b}/6">${'●'.repeat(b)}<i>${'●'.repeat(6-b)}</i></span>`};
function vocabItem(v,T){const h=T?(x=>hl(x,T)):esc;
  const syn=(v.synonyms||[]).join(', ');
  return `<li class="item"><div class="body"><p class="ttl"><span class="lang">${LANG[v.lang]||''}</span> ${h(v.word)}</p>
  ${v.meaning?`<p class="vdef">${h(v.meaning)}</p>`:''}
  ${syn?`<p class="meta">${SYN[v.lang]||'同意語'}: ${h(syn)}</p>`:''}
  ${v.example?`<p class="meta">${h(v.example)}${v.exampleJa?' ／ '+h(v.exampleJa):''}</p>`:''}
  <p class="meta">${dots(v.box)}${v.note?`<span>${h(v.note)}</span>`:''}${v.source&&v.source.date?`<span>${fmtShort(v.source.date)}の日記から</span>`:''}</p></div>
  <div class="acts">${!v.meaning&&SAMPLE?`<button class="mini" data-act="vExplain" data-id="${esc(v.id)}">説明を付ける</button>`:''}<button class="mini" data-act="del" data-col="vocab" data-id="${esc(v.id)}">削除</button></div></li>`}

/* ---------- view shells (forms stay put while lists refresh) ---------- */
const shells={
 today:()=>`<div class="summary" id="sum"></div>
  <form class="quick" id="fQuick"><label class="sr" for="qTitle">今日やることを追加</label><input id="qTitle" placeholder="今日やることを書いて追加" autocomplete="off"><button class="btn">追加</button></form>
  <section><h2>今日の予定</h2><ul class="list" id="lEv"></ul></section>
  <section><h2>やること <small>期限切れ・今日まで・優先度「高」</small></h2><ul class="list" id="lTk"></ul></section>
  <section><h2>今日の習慣</h2><ul class="list" id="lHb"></ul></section>
  <section><h2>今日の日記</h2><div id="tDiary"></div></section>`,
 tasks:()=>`<section><h2 id="tHead">タスクを追加</h2>
  <form class="form" id="fTask">
   <div class="row"><label for="tTitle">内容</label><input id="tTitle" required autocomplete="off" placeholder="例：見積書を送る"></div>
   <div class="grid">
    <div class="row"><label for="tDue">期限</label><input id="tDue" type="date"></div>
    <div class="row"><label for="tPri">優先度</label><select id="tPri"><option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option></select></div>
    <div class="row"><label for="tCat">分類</label><input id="tCat" list="cats" autocomplete="off" placeholder="例：IPPジャパン"></div>
   </div>
   <div class="formacts"><button type="button" class="btn ghost" id="tCancel" hidden>編集をやめる</button><button class="btn" id="tSubmit">追加</button></div>
  </form></section>
  <div class="chips" id="chips"></div><ul class="list" id="lTasks"></ul>`,
 habits:()=>`<section><h2>習慣を追加</h2>
  <form class="quick" id="fHabit" style="margin-top:0"><label class="sr" for="hName">習慣の名前</label><input id="hName" placeholder="例：朝のストレッチ、ロシア語の音読" autocomplete="off" required><button class="btn">追加</button></form></section>
  <section><h2>記録 <small>日付をタップで記録・取り消し</small></h2><div class="list" id="lHabits"></div></section>`,
 schedule:()=>`<section><h2 id="eHead">予定を追加</h2>
  <form class="form" id="fEvent">
   <div class="row"><label for="eTitle">件名</label><input id="eTitle" required autocomplete="off" placeholder="例：取引先と打ち合わせ"></div>
   <div class="grid">
    <div class="row"><label for="eDate">日付</label><input id="eDate" type="date" required></div>
    <div class="row"><label for="eStart">開始</label><input id="eStart" type="time"></div>
    <div class="row"><label for="eEnd">終了</label><input id="eEnd" type="time"></div>
   </div>
   <div class="grid">
    <div class="row"><label for="ePlace">場所</label><input id="ePlace" autocomplete="off"></div>

   </div>
   <div class="formacts"><button type="button" class="btn ghost" id="eCancel" hidden>編集をやめる</button><button class="btn" id="eSubmit">追加</button></div>
  </form>
  <p class="note">「カレンダーに追加」を押すと Google カレンダーの登録画面が開きます（インターネット接続が必要です）。iPhone の「設定 → カレンダー → アカウント」で Google アカウントを追加しておくと、iPhone のカレンダーにも表示されます。開始時刻を空欄にすると終日の予定になります。</p></section>
  <div id="lEvents"></div><button class="linkbtn" id="pastBtn" data-act="past"></button>`,
 search:()=>`<section><h2>検索</h2><form class="quick" id="fSearch" role="search" style="margin-top:0"><label class="sr" for="sQ">検索する言葉</label><input id="sQ" type="search" placeholder="例：見積、打ち合わせ、слово" autocomplete="off" enterkeyhint="search"></form>
  <div class="chips" id="sChips"></div><div id="sRes"></div></section>`,
 memo:()=>`<section id="mList"><div class="dnav"><h2 style="justify-content:flex-start;text-align:left">メモ <small>新しく更新した順</small></h2><button class="btn" data-act="mNew">新しいメモ</button></div><ul class="list" id="lMemo"></ul></section>
  <section id="mEdit" hidden><div class="dnav"><button class="mini" data-act="mBack">‹ 一覧へ</button><span class="found" id="mSave"></span><button class="mini" id="mDel" data-act="del" data-col="memos">削除</button></div>
  <div class="paper"><label class="sr" for="mTitle">タイトル</label><input id="mTitle" class="mtitle" placeholder="タイトル" autocomplete="off"><label class="sr" for="mBody">本文</label><textarea id="mBody" placeholder="アイデア、覚えておきたいこと、用語の控えなど、自由に書いてください。自動で保存されます。"></textarea></div></section>`,
 diary:()=>`<section><div class="dnav"><button class="mini" data-act="dPrev">‹ 前の日</button><h2 id="dHead"></h2><button class="mini" id="dNext" data-act="dNext">次の日 ›</button></div>
  <div class="qa" id="qa"><h2>今日の作文 <small>各言語1問 ・ 短くても長くても</small></h2>
   <div class="chips" id="qLang" style="margin-top:0"></div>
   <p class="found" id="qMsg0"></p>
   <div id="qWrap" hidden>
    <div class="qcard" id="qCard" data-lang="ru">
     <p class="qmeta"><span class="lang" id="qBadge"></span><span class="lvl" id="qLvl"></span><span id="qTheme"></span></p>
     <p class="qtext" id="qText"></p>
     <p class="qgram" id="qGram"></p>
     <p class="qprac" id="qPrac"></p>
     <details id="qSampleBox"><summary>サンプルの答えを読む（読解・まねて書く手本）</summary><p class="ctext" id="qSample"></p><p class="found" style="margin-top:6px">単語や表現を長押しで選ぶと単語帳に送れます。</p></details>
     <div id="qDrill"></div>
    </div>

/* ---------- AI check result ---------- */
function checkHtml(c){
  const V=new Set(Store.data.vocab.map(v=>vKey(v.lang,v.word)));
  const issues=c.issues||[], words=c.words||[];
  const notIn=words.filter(w=>!V.has(vKey(c.lang,w.word))).length;
  return `<div class="chk" data-lang="${esc(c.lang)}">
   ${c.comment?`<p class="ccom">${esc(c.comment)}</p>`:''}
   <h4>訂正後</h4><p class="ctext">${esc(c.corrected)}</p>
   ${c.natural&&c.natural.trim()&&c.natural.trim()!==String(c.corrected||'').trim()?`<h4>より自然な言い方</h4><p class="ctext">${esc(c.natural)}</p>`:''}
   <h4>指摘（${issues.length}件）</h4>
   ${issues.length?`<ol class="issues">${issues.map(i=>`<li><span class="ityp">${esc(i.type||'その他')}</span><span class="wr">${esc(i.wrong)}</span> → <span class="rt">${esc(i.right)}</span>${i.explanation?`<p>${esc(i.explanation)}</p>`:''}</li>`).join('')}</ol>`:'<p class="found">間違いは見つかりませんでした。</p>'}
   ${words.length?`<h4>覚えたい単語</h4><ul class="list">${words.map((w,k)=>`<li class="item"><div class="body"><p class="ttl">${esc(w.word)}<span class="vmean">${esc(w.meaning)}</span></p>${w.example?`<p class="meta">${esc(w.example)}${w.exampleJa?' ／ '+esc(w.exampleJa):''}</p>`:''}${w.note?`<p class="meta">${esc(w.note)}</p>`:''}</div>
     <div class="acts">${V.has(vKey(c.lang,w.word))?'<span class="found">登録済み</span>':`<button class="mini" data-act="vAdd" data-id="${esc(c.id)}" data-k="${k}">＋単語帳</button>`}</div></li>`).join('')}</ul>
     ${notIn>1?`<button class="linkbtn" data-act="vAddAll" data-id="${esc(c.id)}">まとめて単語帳に追加（${notIn}語）</button>`:''}`:''}
   <p class="found" style="margin-top:6px">${LANG[c.lang]||''} ・ 添削 ${fmtStamp(c.created||c.updated)} ・ 単語や表現を長押しで選ぶと「単語帳へ」が出ます</p></div>`}

/* ---------- list rendering ---------- */
function refresh(){
  if(S.day!==today()){S.day=today();header()}
  const D=Store.data, td=today();
  const open=D.tasks.filter(t=>!t.done);
  const overdue=open.filter(t=>t.due&&t.due<td).length;
  const b=$('#badge'); b.hidden=!overdue; b.textContent=overdue;
  const cats=[...new Set([...DEFAULT_CATS,...D.tasks.map(t=>t.category).filter(Boolean)])];
  $('#cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  const habits=[...D.habits].sort((a,b)=>(a.created||'').localeCompare(b.created||''));
  const loading=Store.mode==='loading';

  if(S.tab==='today'){
    const ev=D.events.filter(e=>e.date===td).sort(sortEv);
    const tk=open.filter(t=>(t.due&&t.due<=td)||(!t.due&&t.priority==='high')).sort(sortTasks);
    const doneH=habits.filter(h=>h.log&&h.log[td]).length, dueV=D.vocab.filter(isDue).length;
    $('#sum').innerHTML=`<span>予定 <b>${ev.length}</b> 件</span><span>やること <b>${tk.length}</b> 件</span><span>習慣 <b>${doneH}</b> / ${habits.length}</span>${(()=>{const n=LANGS.filter(l=>{const p=getPrompt(td,l);return p&&p.answer&&p.answer.trim()}).length;return `<span>今日の作文 <b>${n}</b> / 3</span>`})()}${dueV?`<span>単語の復習 <b>${dueV}</b> 語</span>`:''}${overdue?`<span style="color:var(--danger)">期限切れ <b style="color:var(--danger)">${overdue}</b> 件</span>`:''}`;
    $('#lEv').innerHTML=loading?'':ev.length?ev.map(e=>evItem(e,false)).join(''):empty('今日の予定はありません。「予定」から追加できます。');
    $('#lTk').innerHTML=loading?'':tk.length?tk.map(taskItem).join(''):empty('急ぎのタスクはありません。上の欄に書くと今日まで期限のタスクになります。');
    $('#lHb').innerHTML=loading?'':habits.length?habits.map(habitToday).join(''):empty('まだ習慣がありません。「習慣」から追加すると、ここで毎日チェックできます。');
    const de=D.diary.find(x=>x.id===td);
    $('#tDiary').innerHTML=loading?'':de?`<button class="dprev" data-act="dOpen" data-d="${td}"><span>${esc(snip(de.text,120))}</span><small>続きを書く</small></button>`
      :`<button class="dprev empty-d" data-act="dOpen" data-d="${td}"><span>今日あったこと、感じたことを書き残しておきましょう。</span><small>日記を書く</small></button>`;
  }
  if(S.tab==='diary'){
    const ta=$('#dText');
    if(ta&&!dDirty&&(document.activeElement!==ta||!ta.value)){const e=D.diary.find(x=>x.id===S.dDate),v=e?e.text||'':''; if(ta.value!==v){ta.value=v;dCount()}}
    const dmap={}; D.diary.filter(x=>x.text).forEach(x=>dmap[x.id]={id:x.id,text:x.text});
    D.prompts.filter(p=>p.answer&&p.answer.trim()).forEach(p=>{const o=dmap[p.date]||(dmap[p.date]={id:p.date,text:'',n:0}); o.n=(o.n||0)+1; if(!o.text) o.text=p.answer});
    const L=Object.values(dmap).sort((a,b)=>b.id.localeCompare(a.id)).slice(0,60);
    $('#lDiary').innerHTML=loading?'':L.length?L.map(e=>{const n=D.checks.filter(c=>c.date===e.id).length;
      return `<li><button class="dprev ${e.id===S.dDate?'cur':''}" data-act="dOpen" data-d="${esc(e.id)}"><b>${fmtLong(e.id)}${e.n?` ・ 作文${e.n}`:''}${n?` ・ 添削${n}件`:''}</b><span>${esc(snip(e.text,80))}</span></button></li>`}).join('')
      :empty('書いた日記がここに新しい順に並びます。');
    renderAI(); renderQA();
  }
  if(S.tab==='learn') renderLearn();
  if(S.tab==='search'){
    const T=terms(),kinds=[['all','すべて'],['tasks','タスク'],['events','予定'],['diary','日記'],['memo','メモ'],['vocab','単語'],['prompts','作文'],['checks','添削'],['habits','習慣']];
    $('#sChips').innerHTML=kinds.map(([k,l])=>`<button class="chip" data-act="sKind" data-v="${k}" aria-pressed="${S.sKind===k}">${l}</button>`).join('');
    const out=$('#sRes');
    if(!T.length) out.innerHTML=empty('タスク・予定・日記・メモ・単語帳・添削・習慣の中から探します。スペースで区切って複数の言葉を入れると、すべてを含むものに絞り込みます。');
    else{
      const want=k=>S.sKind==='all'||S.sKind===k, g=[];
      if(want('tasks')){const L=D.tasks.filter(t=>hit([t.title,t.category],T)).sort(sortTasks);
        if(L.length) g.push(['タスク',L.map(t=>`<li class="item ${t.done?'done':''}"><div class="body"><p class="ttl">${hl(t.title,T)}</p><p class="meta"><span>${t.done?'完了':'未完了'}</span>${t.due?`<span class="due">期限 ${fmtShort(t.due)}</span>`:''}${t.category?`<span class="cat">${hl(t.category,T)}</span>`:''}</p></div><div class="acts"><button class="mini" data-act="editTask" data-id="${esc(t.id)}">開く</button></div></li>`)])}
      if(want('events')){const L=D.events.filter(e=>hit([e.title,e.place,e.memo],T)).sort((a,b)=>sortEv(b,a));
        if(L.length) g.push(['予定',L.map(e=>`<li class="item"><div class="body"><p class="ttl">${hl(e.title,T)}</p><p class="meta"><span class="due">${fmtShort(e.date)}${e.start?' '+e.start:' 終日'}</span>${e.place?`<span>${hl(e.place,T)}</span>`:''}${e.memo?`<span>${hl(e.memo,T)}</span>`:''}</p></div><div class="acts"><button class="mini" data-act="openEvent" data-id="${esc(e.id)}">開く</button></div></li>`)])}
      if(want('diary')){const L=D.diary.filter(x=>x.text&&hit([x.text],T)).sort((a,b)=>b.id.localeCompare(a.id));
        if(L.length) g.push(['日記',L.map(e=>`<li><button class="dprev" data-act="dOpen" data-d="${esc(e.id)}"><b>${fmtLong(e.id)}</b><span>${hl(around(e.text,T,110),T)}</span></button></li>`)])}
      if(want('memo')){const L=D.memos.filter(m=>hit([m.title,m.body],T)).sort((a,b)=>(b.updated||0)-(a.updated||0));
        if(L.length) g.push(['メモ',L.map(m=>`<li><button class="dprev" data-act="mOpen" data-id="${esc(m.id)}"><b class="mt">${m.title&&m.title.trim()?hl(m.title,T):'（無題）'}</b>${m.body?`<span>${hl(around(m.body,T,110),T)}</span>`:''}</button></li>`)])}
      if(want('vocab')){const L=D.vocab.filter(v=>hit([v.word,v.meaning,(v.synonyms||[]).join(' '),v.example,v.exampleJa,v.note],T)).sort((a,b)=>(b.created||0)-(a.created||0));
        if(L.length) g.push(['単語',L.map(v=>vocabItem(v,T))])}
      if(want('checks')){const L=D.checks.filter(c=>hit([c.corrected,c.natural,c.comment,...(c.issues||[]).flatMap(i=>[i.wrong,i.right,i.type,i.explanation])],T)).sort((a,b)=>(b.created||0)-(a.created||0));
        if(L.length) g.push(['添削',L.map(c=>`<li><button class="dprev" data-act="chkOpen" data-id="${esc(c.id)}"><b>${c.date?fmtLong(c.date):''} ・ ${LANG[c.lang]||''}</b><span>${hl(around([c.corrected,...(c.issues||[]).map(i=>i.wrong+' → '+i.right+' '+(i.explanation||''))].join(' '),T,110),T)}</span></button></li>`)])}
      if(want('prompts')){const L=D.prompts.filter(p=>hit([p.question,p.answer,p.sample,(p.practice||[]).join(' ')],T)).sort((a,b)=>b.date.localeCompare(a.date));
        if(L.length) g.push(['作文',L.map(p=>`<li><button class="dprev" data-act="qOpen" data-id="${esc(p.id)}"><b>${fmtLong(p.date)} ・ ${LANG[p.lang]||''}</b><span>${hl(p.question,T)}</span>${p.answer?`<span class="meta">${hl(around(p.answer,T,90),T)}</span>`:''}</button></li>`)])}
      if(want('habits')){const L=D.habits.filter(h=>hit([h.name],T));
        if(L.length) g.push(['習慣',L.map(h=>`<li class="item"><div class="body"><p class="ttl">${hl(h.name,T)}</p><p class="meta">${streak(h.log)}日連続</p></div><div class="acts"><button class="mini" data-act="openHabits">開く</button></div></li>`)])}
      const n=g.reduce((s,x)=>s+x[1].length,0);
      out.innerHTML=n?`<p class="found">${n}件見つかりました</p>`+g.map(([name,items])=>`<div class="evday"><h3>${name}（${items.length}件）</h3><ul class="list">${items.join('')}</ul></div>`).join('')
        :empty(`「${esc(S.q.trim())}」に一致するものはありません。言葉を短くするか、別の言い方でお試しください。`);
    }
  }
  if(S.tab==='memo'){
    if(S.memoId){const t=$('#mTitle'),bd=$('#mBody'),m=D.memos.find(x=>x.id===S.memoId);
      if(m&&t&&!mDirty&&document.activeElement!==t&&document.activeElement!==bd){ if(t.value!==(m.title||''))t.value=m.title||''; if(bd.value!==(m.body||''))bd.value=m.body||'' }}
    const L=[...D.memos].sort((a,b)=>(b.updated||0)-(a.updated||0));
    $('#lMemo').innerHTML=loading?'':L.length?L.map(m=>`<li><button class="dprev" data-act="mOpen" data-id="${esc(m.id)}"><b class="mt">${esc(m.title&&m.title.trim()?m.title:'（無題）')}</b>${m.body?`<span>${esc(snip(m.body,90))}</span>`:''}<small class="mu">${fmtStamp(m.updated)}</small></button></li>`).join('')
      :empty('まだメモはありません。「新しいメモ」から、思いついたことや覚えておきたいことを書き留められます。');
  }
  if(S.tab==='tasks'){
    const wk=addDays(td,6);
    const filters=[['open','未完了'],['over','期限切れ'],['today','今日まで'],['week','7日以内'],['done','完了済み']];
    const used=[...new Set(D.tasks.map(t=>t.category).filter(Boolean))];
    $('#chips').innerHTML=filters.map(([k,l])=>`<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')
      +(used.length?`<span style="width:100%"></span><button class="chip" data-act="cat" data-v="" aria-pressed="${!S.cat}">すべての分類</button>`+used.map(c=>`<button class="chip" data-act="cat" data-v="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join(''):'');
    let L=D.tasks.filter(t=>{
      if(S.cat&&t.category!==S.cat) return false;
      switch(S.filter){case 'open':return !t.done;case 'over':return !t.done&&t.due&&t.due<td;case 'today':return !t.done&&t.due&&t.due<=td;case 'week':return !t.done&&t.due&&t.due<=wk;case 'done':return !!t.done}
    }).sort(sortTasks);
    if(S.filter==='done') L.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
    $('#lTasks').innerHTML=loading?'':L.length?L.map(taskItem).join(''):empty(D.tasks.length?'この条件のタスクはありません。':'最初のタスクを上の欄から追加してください。期限と優先度を付けると、「今日」の画面に自動で並びます。');
  }
  if(S.tab==='habits'){
    $('#lHabits').innerHTML=loading?'':habits.length?habits.map(h=>{
      const s=streak(h.log), r=rate(h);
      let days=''; for(let i=6;i>=0;i--){const d=addDays(td,-i),dt=parse(d),on=!!(h.log&&h.log[d]);
        days+=`<button class="day ${on?'on':''} ${i===0?'is-today':''}" data-act="toggleHab" data-id="${esc(h.id)}" data-d="${d}" aria-pressed="${on}" aria-label="${fmtLong(d)}">${WD[dt.getDay()]}<b>${dt.getDate()}</b></button>`}
      return `<div class="habit-card"><div class="habit-head"><p class="ttl">${esc(h.name)}</p><button class="mini" data-act="del" data-col="habits" data-id="${esc(h.id)}">削除</button></div>
        <div class="stats"><span><b>${s}</b> 日連続</span><span><b>${r.pct}</b>% 達成（直近${r.span}日）</span></div><div class="week">${days}</div></div>`}).join('')
      :empty('続けたいことを上の欄から追加してください。毎日の記録と連続日数がここに表示されます。');
  }
  if(S.tab==='schedule'){

    const groups={}; L.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
    $('#lEvents').innerHTML=loading?'':L.length?Object.keys(groups).map(d=>`<div class="evday"><h3 class="${d===td?'is-today':''}">${d===td?'今日・':''}${fmtLong(d)}</h3><ul class="list">${groups[d].map(e=>evItem(e,true)).join('')}</ul></div>`).join('')

function curLang(){ if(S.lang) return S.lang; const ta=$('#dText'); return detectLang(ta?ta.value:'')||'ru' }
function renderAI(){
  const box=$('#aiOut'); if(!box) return;
  const lang=curLang(), running=S.ai&&!S.ai.pid&&S.ai.date===S.dDate;
  $('#aiLang').innerHTML=LANGS.map(l=>`<button class="chip" data-act="aiLang" data-v="${l}" aria-pressed="${lang===l}">${LANG[l]}</button>`).join('');
  const run=$('#aiRun'), stop=$('#aiStop'), msg=$('#aiMsg');
  run.hidden=!SAMPLE||!!running; stop.hidden=!running; run.disabled=!!S.ai;
  msg.textContent=running?'AIが添削しています…（数十秒かかることがあります）':SAMPLE===null?'AI添削は Claude 版で使えます。ここでは添削結果の確認と単語の練習ができます。':SAMPLE===undefined?'':'';
  if(running){ box.innerHTML=''; return }
  const list=Store.data.checks.filter(c=>!c.pid&&c.date===S.dDate&&c.lang===lang).sort((a,b)=>(b.created||0)-(a.created||0));
  const others=Store.data.checks.filter(c=>!c.pid&&c.date===S.dDate&&c.lang!==lang);
  box.innerHTML=list.length?checkHtml(list[0])+(list.length>1?`<p class="found" style="margin-top:8px">この日の${LANG[lang]}の添削は${list.length}回あります（最新を表示）。すべて「語学」タブとExcelに残っています。</p>`:'')
    :(others.length?`<p class="found" style="margin-top:8px">この日は${[...new Set(others.map(c=>LANG[c.lang]))].join('・')}の添削があります。上の言語を切り替えると表示されます。</p>`:'');
}
const TYPES={ru:'Падеж, Вид глагола, Спряжение, Согласование, Управление, Предлог, Порядок слов, Лексическая сочетаемость, Стилистика, Орфография, Пунктуация, Другое',
  es:'Conjugación, Tiempos verbales, Subjuntivo, Ser/Estar, Artículos, Concordancia, Preposiciones, Orden de palabras, Ortografía y acentos, Léxico, Puntuación, Otro',
  en:'Tense, Articles, Prepositions, Subject-verb agreement, Singular/Plural, Word order, Spelling, Word choice, Collocation, Punctuation, Other'};
const SYN={ru:'Синонимы',es:'Sinónimos',en:'Synonyms'};
function aiPrompt(lang,text,q){
  const qline=!q?'':lang==='ru'?`Это ответ на вопрос: «${q}». Исправляй только ответ.\n\n`:lang==='es'?`Es la respuesta a la pregunta: «${q}». Corrige solo la respuesta.\n\n`:`This is an answer to the question: "${q}". Correct only the answer.\n\n`;
  const body=text.slice(0,6000);
  if(lang==='ru') return `Ты — опытный редактор и преподаватель русского языка. Автор дневника владеет русским на уровне C2, поэтому не объясняй элементарное: ищи и неочевидные ошибки — управление, видовые пары, сочетаемость, кальки, порядок слов, пунктуацию, стилистические неточности и неестественные обороты.

const str=(v,n)=>typeof v==='string'?v.slice(0,n||4000):'';
async function runCheck(o){
  if(!SAMPLE){toast('この画面ではAI添削を使えません');return}
  if(!Store.ready()||S.ai) return;
  const text=String(o.text||'').trim(); if(!text){toast(o.pid?'先に答えを書いてください':'先に日記を書いてください');return}
  const lang=o.lang, date=o.date, ctl=new AbortController();
  S.ai={date,lang,ctl,pid:o.pid||null}; renderAI(); renderQA();
  try{
    const r=await SAMPLE.json(aiPrompt(lang,text,o.question),{signal:ctl.signal});
    if(!r||typeof r!=='object'||typeof r.corrected!=='string') throw {code:'invalid_json'};
    const issues=(Array.isArray(r.issues)?r.issues:[]).slice(0,60).filter(i=>i&&typeof i==='object').map(i=>({wrong:str(i.wrong,500),right:str(i.right,500),type:str(i.type,40)||'その他',explanation:str(i.explanation,800)}));
    const fx=x=>lang==='ru'?unstress(x):x;
    const rec={date,lang,original:text.slice(0,20000),corrected:fx(str(r.corrected,20000)),natural:fx(str(r.natural,20000)),comment:str(r.comment,1000),issues,words:[],created:Date.now()};
    if(o.pid){ rec.pid=o.pid; rec.question=o.question||'' }
    await Store.add('checks',rec);
    if(o.pid){ const words=text.split(/\s+/).filter(Boolean).length;
      await Store.update('prompts',o.pid,{words,issues:issues.length,checkedAt:Date.now()});
      setTimeout(()=>evalLevel(lang),1500) }
    else S.lang=lang;
    toast(issues.length?`添削しました（指摘 ${issues.length}件）`:'添削しました。間違いはありませんでした');
  }catch(e){
    aiFail(e);
  }finally{ S.ai=null; if(S.tab==='diary'){renderAI();renderQA()} }
}
function aiFail(e){
    const c=e&&e.code;
    if(c!=='cancelled') toast(c==='not_granted'?'AIの使用が許可されませんでした':c==='rate_limited'?'混み合っています。少し時間をおいてお試しください':c==='invalid_json'?'添削結果を読み取れませんでした。もう一度お試しください':c==='session_expired'?'Claude に再ログインしてください':'添削できませんでした。もう一度お試しください',4500);
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed') SAMPLE=null;
}

  const block=l=>`### ${l}（${LANG[l]}）\nレベル: ${lv[l]} — ${LV_DESC[lv[l]]||''}\n${foc[l]?`今日の文法: ${foc[l][1]}\n`:''}${wk(l)}\n最近出した質問（これらと重ならないこと）:\n${recentQ(l)}`;
  return `あなたは、ロシア語・スペイン語・英語の作文を指導する先生です。学習者は日本語を母語とする大人の女性で、日記の代わりに、毎日各言語で1問ずつの質問に答えて書く練習をしています。今日（${date}）の質問を作ってください。

条件:
- 政治・外交・戦争・時事的な論争は扱わないこと。日常、思い出、食、自然、季節、旅、芸術、音楽、本、映画、言葉、仕事や学び、人との関わり、仮定の話など、言語ごとに違うテーマにし、毎日変化をつけること。
- question: 短くても長くても答えられる、開かれた質問を1つ。その言語で書く。指定レベルにふさわしい語彙と構文で。
- sample: その質問への見本の答え。指定レベルの自然な文章で5行程度（3〜5文）。学習者が読解し、まねて書く手本になる。最近の間違いがあれば、その正しい形を自然に1〜2か所使う。
- practice: 今日の答えで使ってみてほしい表現を2〜3個（sample の中から、その言語で）。最近の間違いに関係するものを優先する。

- ロシア語には強勢記号を付けないこと。

${langs.map(block).join('\n\n')}

次の形のJSONだけを返してください（上に挙げた言語のキーだけ）。JSON以外の文章は書かないでください。
{${langs.map(l=>`"${l}":{"question":"…","sample":"…","practice":["…"],"theme":"…"${foc[l]?',"drill":[{"q":"…","a":"…","hint":"…"}]':''}}`).join(',')}}`}
async function ensureToday(){
  const d=today(); if(!SAMPLE||S.qGen||S.qErr||Store.mode==='loading') return;
  const missing=LANGS.filter(l=>needGen(d,l)); if(!missing.length) return;
  S.qGen=true; renderQA();
  try{
    const foc={}; missing.forEach(l=>{const g=pickGrammar(l); if(g) foc[l]=g});
    const r=await SAMPLE.json(genPromptText(d,missing,foc));
    let n=0;
    for(const l of missing){ const x=r&&r[l]; if(!x||typeof x.question!=='string'||!x.question.trim()||!needGen(d,l)) continue;
      const fx=t=>l==='ru'?unstress(t):t;
      await Store.put('prompts',pidOf(d,l),{date:d,lang:l,level:levels()[l],question:fx(str(x.question,600)),sample:fx(str(x.sample,3000)),
        practice:(Array.isArray(x.practice)?x.practice:[]).map(p=>fx(str(p,120)).trim()).filter(Boolean).slice(0,4),theme:str(x.theme,40),answer:'',created:Date.now(),
        gkey:foc[l]?foc[l][0]:'',grammar:foc[l]?foc[l][1]:'',drill:foc[l]&&Array.isArray(x.drill)?x.drill.filter(q=>q&&typeof q==='object'&&str(q.q,300).includes('___')).slice(0,8).map(q=>({q:str(q.q,300),a:str(q.a,120),hint:str(q.hint,160)})):[]}); n++ }
    if(!n) throw {code:'invalid_json'};
  }catch(e){ S.qErr=true; if(e&&e.code!=='cancelled') toast('今日の質問を作れなかったため、用意してある質問を表示します',4500) }
  finally{ S.qGen=false; if(S.tab==='diary') renderQA() }
}

const unstress=x=>String(x||'').normalize('NFD').replace(/́/g,'').normalize('NFC');
function wordPrompt(lang,text,context){const ctx=context||text;
  if(lang==='ru') return `Ты — преподаватель русского языка, учащийся владеет языком на уровне C2. В тексте он выделил выражение: «${text}».

Верни только JSON такого вида, без другого текста:
{"word":"словарная (начальная) форма; для устойчивого выражения — само выражение","meaning":"толкование значения в этом контексте: синонимы и краткое пояснение, 1–2 предложения","synonyms":["2–5 синонимов или близких по смыслу выражений"],"example":"пример употребления (можно взять предложение из контекста, исправив при необходимости)","note":"грамматика и сочетаемость кратко: род, видовая пара, управление, стилистическая окраска; пустая строка, если добавить нечего"}`;
  if(lang==='es') return `Eres profesor de español; la estudiante tiene nivel B2. En un texto ha seleccionado la expresión: «${text}».
Contexto: «${ctx}»

Redacta una entrada para su vocabulario personal. Escribe solo en español. Explica el significado con sinónimos y una breve definición, sin traducir a otros idiomas.
Devuelve solo un JSON con esta forma, sin otro texto:
{"word":"forma de diccionario (con artículo si es un sustantivo, p. ej. la mesa); si es una locución, la locución","meaning":"significado en este contexto: sinónimos y una breve explicación, 1–2 frases","synonyms":["2–5 sinónimos o expresiones cercanas"],"example":"ejemplo de uso (puede ser la frase del contexto, corregida si hace falta)","note":"notas breves de gramática y uso: género, régimen preposicional, registro; cadena vacía si no hay nada que añadir"}`;
  return `You are an English teacher; the learner is at B2 level. In a text they selected the expression: "${text}".
Context: "${ctx}"

Write an entry for their personal vocabulary list. Write only in English. Explain the meaning with synonyms and a short definition, without translating into other languages.
Return only JSON in this shape, with no other text:
{"word":"dictionary form (for a phrase, the phrase itself)","meaning":"meaning in this context: synonyms and a short explanation, 1–2 sentences","synonyms":["2–5 synonyms or close expressions"],"example":"an example of use (the context sentence may be used, corrected if needed)","note":"brief grammar and usage notes: part of speech, common collocations, register; empty string if nothing to add"}`}
async function explainWord(lang,text,context){
  const r=await SAMPLE.json(wordPrompt(lang,text,context));
  if(!r||typeof r!=='object') throw {code:'invalid_json'};
  const fx=x=>lang==='ru'?unstress(x):x;
  return {word:fx(str(r.word,200).trim()||text),meaning:fx(str(r.meaning,800)),synonyms:(Array.isArray(r.synonyms)?r.synonyms:[]).map(x=>fx(str(x,80)).trim()).filter(Boolean).slice(0,8),
    example:fx(str(r.example,500))||context||'',exampleJa:str(r.exampleJa,500),note:fx(str(r.note,400))} }
function sentenceAround(text,sel){text=String(text||''); const i=text.indexOf(sel); if(i<0) return '';
  const marks=['.','!','?','\n','。','…'];
  const st=Math.max(...marks.map(c=>text.lastIndexOf(c,i-1)))+1;
  const ends=marks.map(c=>text.indexOf(c,i+sel.length)).filter(x=>x>=0), en=ends.length?Math.min(...ends)+1:text.length;
  return text.slice(st,en).trim().slice(0,400)}

  const C=[...D.checks].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0));
  add('毎日の作文',[['日付','曜日','言語','レベル','テーマ','今日の文法','質問','サンプルの答え','使ってみたい表現','動詞トレーニング','自分の答え','語数','指摘数'],
    ...[...D.prompts].sort((a,b)=>a.date.localeCompare(b.date)||LANGS.indexOf(a.lang)-LANGS.indexOf(b.lang)).map(p=>[p.date,wd(p.date),LANG[p.lang]||'',p.level||'',p.theme||'',p.grammar||'',p.question||'',cut(p.sample),(p.practice||[]).join(' / '),(p.drill||[]).map((q,i)=>`${i+1}. ${q.q} → ${q.a}`).join('\n'),cut(p.answer),p.words||(p.answer||'').trim().split(/\s+/).filter(Boolean).length,p.checkedAt?(p.issues||0):''])],[12,6,10,6,10,30,50,60,30,50,60,6,6]);
  add('添削',[['日付','曜日','言語','質問','元の文','訂正後','より自然な言い方','講評','指摘数','添削日時'],
    ...C.map(c=>[c.date||'',wd(c.date),LANG[c.lang]||'',c.question||'',cut(c.original),cut(c.corrected),cut(c.natural),c.comment||'',(c.issues||[]).length,dt(c.created)])],[12,6,10,40,50,50,50,40,8,20]);
  add('指摘事項',[['日付','言語','分類','間違い','正しい形','説明'],
    ...C.flatMap(c=>(c.issues||[]).map(i=>[c.date||'',LANG[c.lang]||'',i.type||'',i.wrong||'',i.right||'',i.explanation||'']))],[12,10,16,30,30,60]);
  add('単語帳',[['言語','単語','意味・説明','同意語','例文','例文の訳','メモ','出典の日付','習熟度（1〜6）','練習回数','正解数','次の復習日','登録日'],
    ...[...D.vocab].sort((a,b)=>(a.lang||'').localeCompare(b.lang||'')||(a.created||0)-(b.created||0)).map(v=>[LANG[v.lang]||'',v.word||'',v.meaning||'',(v.synonyms||[]).join(', '),v.example||'',v.exampleJa||'',v.note||'',(v.source&&v.source.date)||'',v.box||1,v.reviews||0,v.correct||0,v.due||'',dt(v.created)])],[10,20,40,30,40,30,24,12,12,8,8,12,20]);
  const H=[...D.habits].sort((a,b)=>(a.created||'').localeCompare(b.created||''));
  add('メモ',[['タイトル','本文','作成日時','更新日時'],
    ...[...D.memos].sort((a,b)=>(b.updated||0)-(a.updated||0)).map(m=>[m.title||'',cut(m.body),dt(m.created),dt(m.updated)])],[30,80,20,20]);
  add('習慣',[['習慣','開始日','連続日数','達成率（直近30日）','記録した日数'],
    ...H.map(h=>{const r=rate(h);return [h.name,h.created||'',streak(h.log),r.pct+'%',Object.values(h.log||{}).filter(Boolean).length]})],[30,12,10,18,12]);
  let first=td; H.forEach(h=>{ if(h.created&&h.created<first)first=h.created; Object.keys(h.log||{}).forEach(d=>{if(h.log[d]&&d<first)first=d}) });
  const rows=[['日付','曜日',...H.map(h=>h.name)]];
  for(let d=td,i=0;d>=first&&i<3660;d=addDays(d,-1),i++) rows.push([d,wd(d),...H.map(h=>h.log&&h.log[d]?'○':'')]);
  add('習慣の記録',rows,[12,6,...H.map(()=>14)]);
  const payload=JSON.stringify({app:'hibi-techou',v:2,exported:Date.now(),data:Object.fromEntries([...COLS.map(c=>[c,D[c]||[]]),['deleted',D.deleted||{}]])});
  const sys=[['このシートはアプリへの読み込み用です。編集・削除しないでください。']]; for(let i=0;i<payload.length;i+=30000) sys.push([payload.slice(i,i+30000)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sys),'_system');
  wb.Workbook={Sheets:wb.SheetNames.map(n=>({Hidden:n==='_system'?1:0}))};
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
async function exportXlsx(){
  if(!Store.ready())return;
  if(typeof XLSX==='undefined'){toast('書き出し機能を読み込めませんでした。開き直してください');return}
  saveDiary(); saveMemo();
  const n=new Date(), name=`日々の手帳_${today()}_${pad(n.getHours())}${pad(n.getMinutes())}.xlsx`;
  if(await saveFile(buildWorkbook(),name)){ Store.meta.lastExport=Date.now(); Store.saveMeta(); status(); toast('書き出しました') }
}
$('#btnExport').addEventListener('click',exportXlsx);

/* ---------- import from Excel (merge by id; newer edit wins; deletions carried) ---------- */
function mergeData(inc){
  const D=Store.data, tombIn=inc.deleted||{}, deleted={}, changes=[], res={added:0,updated:0,removed:0};
  COLS.forEach(c=>{
    const tombs=Object.assign({},(D.deleted||{})[c]||{});
    Object.entries(tombIn[c]||{}).forEach(([id,ts])=>{ ts=+ts||0; if(!tombs[id]||ts>tombs[id]) tombs[id]=ts });
    const map=new Map((D[c]||[]).map(x=>[x.id,x])), before=new Map(map);
    (Array.isArray(inc[c])?inc[c]:[]).forEach(it=>{ if(!it||typeof it!=='object'||!okId(it.id)) return; const cur=map.get(it.id);
      if(c==='prompts'&&cur&&!!cur.bank!==!!it.bank){ const ha=x=>!!String(x.answer||'').trim();
        const pick=ha(cur)!==ha(it)?(ha(cur)?cur:it):(cur.bank?it:cur); if(pick!==cur) map.set(it.id,pick); return }
      if(!cur||(it.updated||0)>(cur.updated||0)) map.set(it.id,it) });
    for(const [id,it] of map) if(tombs[id]!=null&&tombs[id]>=(it.updated||0)) map.delete(id);
    for(const [id,it] of map){ if(!before.has(id)){res.added++;changes.push({c,id,item:it})} else if(before.get(id)!==it){res.updated++;changes.push({c,id,item:it})} }
    for(const id of before.keys()) if(!map.has(id)){res.removed++;changes.push({c,id,item:null})}
    deleted[c]=tombs;
  });
  return {changes,deleted,res};
}
async function importFile(f){
  if(!Store.ready()) return;
  if(typeof XLSX==='undefined'){toast('読み込み機能を準備できませんでした。開き直してください');return}
  saveDiary(); saveMemo();
  let wb; try{ wb=XLSX.read(await f.arrayBuffer(),{type:'array'}) }catch(e){ toast('Excelファイルとして開けませんでした',4000); return }
  const ws=wb.Sheets['_system'];
  if(!ws){ toast('このファイルには読み込み用のデータがありません。「日々の手帳」で書き出したファイルを選んでください',5000); return }
  let p; try{ const rows=XLSX.utils.sheet_to_json(ws,{header:1}); p=JSON.parse(rows.slice(1).map(r=>r&&r[0]?String(r[0]):'').join('')) }catch(e){ p=null }
  if(!p||p.app!=='hibi-techou'||!p.data){ toast('読み込み用のデータが壊れています。書き出し直したファイルでお試しください',5000); return }
  const m=mergeData(p.data);
  if(m.changes.length) toast('読み込み中…',60000);
  const ok=await Store.apply(m); if(!ok) return;
  S.memoId=null; S.card=null; setTab(S.tab==='search'?'today':S.tab);
  const r=m.res;
  toast(r.added||r.updated||r.removed?`読み込みました：追加 ${r.added}件・更新 ${r.updated}件・削除 ${r.removed}件`:'読み込みました（変更はありませんでした）',5000);
}
$('#btnImport').addEventListener('click',()=>$('#fileIn').click());
$('#fileIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) importFile(f)});

header(); setTab(location.hash.slice(1)); Store.init();
if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden) r.update().catch(()=>{})})}).catch(()=>{})) }
})();
